<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML - Tag, Elements, Attributes, Nesting</title>
</head>
<body>
    <h1>HTML - Tag, Elements, Attributes, Nesting</h1>
    <!-- Tag-->
    <p>Hello</p>  <!-- <p> is a open tag, </p> is a closing tag -->
    <!-- Elements is a piece of content within the HTML document -->
     <!-- h1 - h6: heading; p: paragraph; div: division ; span: inline division ; a: link; button-->
    <!-- Attributes are additional properties that can be added to HTML elements -->
     <!--<tag attribute="value">Content</tag>-->
     <tag attribute="value">Content</tag>
     <!-- Example of attributes -->
      <!--some attribute: src: link to an image or another webpage; alt: clone
        width: specifies the width of an image ; height: specifies the height of an image 
        id: uniquely identifies an element ; class: groups elements for styling -->
    <!-- Nesting is the practice of placing one HTML element inside another -->
     <!-- Example of nesting -->
     <div>
        <h1>Heading</h1>
        <p>This is a paragraph inside a div element.</p>
        </div>
    <!-- bonus-->
     <!-- block-level and inline Elements-->
      <!--div	span
          p	    a
        h1 – h6	strong
        section	em-->
</body>
</html>
